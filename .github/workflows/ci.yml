name: ci

on:
  push:
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: aegis_dev_pw
          POSTGRES_DB: aegis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aegis -d aegis"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      AEGIS_FAKE_LLM: "1"
      DATABASE_URL: postgresql+asyncpg://aegis:aegis_dev_pw@127.0.0.1:5432/aegis
      CHECKPOINT_DATABASE_URL: postgresql://aegis:aegis_dev_pw@127.0.0.1:5432/aegis
      REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install
      - run: uv sync --frozen
      - name: ruff
        run: uv run ruff check . && uv run ruff format --check .
      - name: import-linter
        run: uv run lint-imports
      - name: alembic
        run: uv run alembic upgrade head
      - name: pytest
        run: uv run pytest -q -rs
